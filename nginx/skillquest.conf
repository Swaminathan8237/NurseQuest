# SkillQuest Nginx Configuration for AWS EC2
# Place this file at /etc/nginx/sites-available/skillquest
# Symlink: sudo ln -s /etc/nginx/sites-available/skillquest /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g. app.yourdomain.com) if available

    # Maximum file upload size for quiz media (videos, audio, images)
    client_max_body_size 50M;

    # Root directory for built React frontend static assets
    root /var/www/skillquest/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 1. React SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Static Assets Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 3. Express API Endpoints Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for longer requests (e.g., CSV imports, bulk seeds)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Socket.IO Real-Time Multiplayer WebSockets Proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # WebSocket Upgrade Headers (CRITICAL FOR LIVE GAMES)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time WebSocket communication
        proxy_buffering off;
        proxy_read_timeout 86400s; # Keep WebSocket connection open up to 24 hours
        proxy_send_timeout 86400s;
    }

    # 5. Media Uploads (Images, Audio, Video)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
